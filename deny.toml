# CI checks RustSec advisories with cargo-deny, which reads this file. It is
# the only advisory-exception list.
#
# cargo-deny resolves the dependency graph with features applied, so it
# skips a crate behind a disabled feature. Never ignore such a finding:
# `cargo tree -i <crate>` prints nothing for that crate, and the ignore would
# hide the advisory if someone turns the feature on later.
#
# Every ignore names the crate that brings the advisory in, why no fix
# exists, and what would make the ignore unsafe. Write it as
# { id = "RUSTSEC-...", reason = "..." }.

[advisories]
ignore = []
