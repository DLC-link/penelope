[package]
name = "penelope"
version = "0.1.0"
edition = "2024"
description = "A Given/When/Then scenario runner for eventually consistent systems"
license = "Apache-2.0"
repository = "https://github.com/DLC-link/penelope"
readme = "README.md"

[dependencies]
anyhow = { version = "1.0.98" }
tokio = { version = "1.48.0", features = ["time"] }
tracing = { version = "0.1" }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
